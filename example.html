  <h1>Fibonacci in C — structured project (.h / .c / main.c)</h1>
  <p>
    Three files: <code>fib.h</code> (interface), <code>fib.c</code> (iterative
    implementation) and <code>main.c</code>. Edit and click
    <em>Compile &amp; Run</em>.
  </p>

  <div class="cterminal" data-filename="main.c" data-terminal-position="right"
       data-editor-lines="15" data-cflags="-Wall -Wextra">

    <script type="text/plain">
#include <stdio.h>
#include "fib.h"

#define N 10   /* how many terms to print */

int main(void) {
    printf("Fibonacci sequence (first %d terms):\n", N);
    
    for (unsigned i = 0; i < N; i++) {
        printf("fib(%2u) = %llu\n", i, fib(i));
    }
    
    return 0;
}
// f=main; gcc *.c -o $f -std=c23 -Wall -Wextra; ./$f
    </script>

    <script type="text/plain" data-filename="fib.h">
/* fib.h — interface of the Fibonacci module */
#ifndef FIB_H
#define FIB_H

/* Returns the n-th Fibonacci number (fib(0)=0, fib(1)=1). */
unsigned long long fib(unsigned n);

#endif /* FIB_H */
    </script>

    <script type="text/plain" data-filename="fib.c">
/* fib.c — iterative implementation (O(n), no recursion) */
#include "fib.h"

unsigned long long fib(unsigned n) {
    unsigned long long a = 0, b = 1;
    for (unsigned i = 0; i < n; i++) {
        unsigned long long next = a + b;
        a = b;
        b = next;
    }
    return a;
}
    </script>
